name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test
    # Windows keeps the run honest for the primary target and avoids needing
    # libwebkit2gtk on the runner, which Tauri's Linux backend requires.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Also produces dist/, which `tauri::generate_context!()` reads at
      # compile time — the Rust steps below fail without it.
      - name: Build frontend
        run: npm run build

      # Pure unit tests: the playback reducer and the catalogue merge.
      - name: Unit tests (Vitest)
        run: npm test

      # End-to-end against the production build with a stubbed Rust backend, so
      # the desktop-only paths (banner, connected library, account likes) are
      # exercised without an account.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: End-to-end (stubbed backend)
        shell: pwsh
        run: |
          $server = Start-Process -FilePath "node" -ArgumentList "node_modules/vite/bin/vite.js","preview","--port","4173","--strictPort" -PassThru
          try {
            Start-Sleep -Seconds 4
            node tools/e2e.mjs
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::all

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
