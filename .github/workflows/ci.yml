name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test
    # Windows keeps the run honest for the primary target and avoids needing
    # libwebkit2gtk on the runner, which Tauri's Linux backend requires.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Also produces dist/, which `tauri::generate_context!()` reads at
      # compile time — the Rust steps below fail without it.
      - name: Build frontend
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::all

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
